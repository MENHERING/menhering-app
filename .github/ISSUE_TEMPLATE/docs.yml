name: '📄 문서 작업'
description: 'README, 주석, Wiki, 변경 이력 등 문서 관련 작업을 등록해주세요.'
title: '[DOCS] : '
labels: ['documentation']
body:
  - type: markdown
    attributes:
      value: |
        ## 📄 문서 작업
        추가하거나 수정이 필요한 문서를 아래 형식에 맞게 작성해주세요.

  - type: textarea
    id: target
    attributes:
      label: '🎯 작업 대상 문서'
      description: '어떤 파일 또는 문서 영역이 대상인지 작성해주세요.'
      placeholder: |
        예: README.md — 프로젝트 설치 가이드 섹션
        예: src/lib/api.ts 내 JSDoc 주석 보완
        예: CONTRIBUTING.md 신규 작성
    validations:
      required: true

  - type: dropdown
    id: doc-type
    attributes:
      label: '🗂️ 문서 유형'
      description: '작업 대상 문서의 유형을 선택해주세요.'
      options:
        - README
        - CONTRIBUTING
        - CHANGELOG
        - 인라인 주석 / JSDoc
        - Wiki / 노션 등 외부 문서
        - 환경변수 / 설정 가이드 (.env.example 등)
        - 기타
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: '✏️ 작업 종류'
      description: '수행할 작업의 종류를 선택해주세요.'
      options:
        - 신규 작성
        - 내용 수정
        - 오탈자 / 포맷 교정
        - 삭제 또는 정리
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: '💡 작업 이유'
      description: '왜 이 문서 작업이 필요한지 설명해주세요.'
      placeholder: |
        예: 환경 설정 방법이 문서에 없어 온보딩 시 혼란이 생김
        예: API 응답 구조가 변경됐는데 주석이 구버전 기준으로 남아 있음
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: '💬 추가 정보'
      description: '참고할 링크, 스크린샷, 관련 PR·이슈가 있으면 남겨주세요.'
      placeholder: '예: #42 PR 이후 변경된 구조 반영 필요'
